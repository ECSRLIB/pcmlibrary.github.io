<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Interview Assistant</title>

<style>
body{
  background:#0a0c10;
  color:#fff;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

textarea{
  width:90%;
  height:100px;
  background:#111;
  color:#fff;
  border:1px solid #333;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

input{
  padding:10px;
  width:320px;
  border-radius:8px;
  border:none;
  outline:none;
}

button{
  padding:10px 18px;
  margin:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.card{
  margin-top:20px;
  border:1px solid #333;
  padding:15px;
  border-radius:12px;
  text-align:left;
  background:#111;
}

.q{
  color:#8ecfff;
  font-weight:bold;
  margin-bottom:10px;
}

.a{
  line-height:1.6;
}
</style>

</head>
<body>

<h2>🎤 AI Interview Assistant</h2>

<input id="key" placeholder="Enter Groq API Key">
<button onclick="saveKey()">Save</button>

<br>

<button onclick="startAuto()">🚀 Start</button>
<button onclick="stopAuto()">⏹ Stop</button>

<br>

<textarea id="q" placeholder="Detected question..."></textarea>

<div id="out"></div>

<script>

let recognition;
let isListening = false;

let buffer = "";
let lastSpeech = 0;
let lastSent = "";
let lastChunk = "";

let loop = null;

let stableCount = 0;
let lastStable = "";

const API = "https://api.groq.com/openai/v1/chat/completions";

// SAVE KEY
function saveKey(){
  const key = document.getElementById("key").value.trim();

  if(!key.startsWith("gsk_")){
    alert("Invalid API key");
    return;
  }

  localStorage.setItem("gsk", key);
  alert("Saved");
}

// START
function startAuto(){

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SR){
    alert("Use Google Chrome");
    return;
  }

  if(loop) clearInterval(loop);

  recognition = new SR();

  recognition.continuous = true;

  // 🔥 IMPORTANT
  recognition.interimResults = false;

  recognition.lang = "en-US";

  recognition.maxAlternatives = 1;

  isListening = true;

  recognition.onresult = (e)=>{

    let final = "";

    for(let i=e.resultIndex;i<e.results.length;i++){

      if(e.results[i].isFinal){

        final += e.results[i][0].transcript + " ";
      }
    }

    if(!final) return;

    let clean = normalize(final);

    // duplicate chunk ignore
    if(clean === lastChunk) return;

    lastChunk = clean;

    if(clean.split(" ").length >= 4){

      // keep previous speech
      buffer += " " + clean;

      buffer = buffer.trim();

      lastSpeech = Date.now();
    }

    document.getElementById("q").value = buffer;
  };

  recognition.onerror = (e)=>{
    console.log(e.error);
  };

  recognition.onend = ()=>{

    if(isListening){

      setTimeout(()=>{
        try{
          recognition.start();
        }catch{}
      },300);
    }
  };

  recognition.start();

  // MAIN LOOP
  loop = setInterval(()=>{

    if(!buffer) return;

    // wait for human pause
    if(Date.now() - lastSpeech < 5000) return;

    // stability check
    if(buffer === lastStable){

      stableCount++;

    }else{

      stableCount = 0;
      lastStable = buffer;
    }

    if(stableCount < 2) return;

    // complete question check
    if(!isComplete(buffer)) return;

    let finalQ = getSmartQuestion(buffer);

    if(!finalQ) return;

    if(similar(finalQ,lastSent)) return;

    lastSent = finalQ;

    autoAsk(finalQ);

    buffer = "";

  },900);
}

// STOP
function stopAuto(){

  isListening = false;

  if(recognition){

    recognition.onend = null;

    recognition.stop();
  }

  if(loop){

    clearInterval(loop);
  }
}

// CLEAN TEXT
function normalize(text){

  text = text.toLowerCase();

  // remove repeated words
  text = text.replace(/\b(\w+)(\s+\1)+/gi,'$1');

  // remove fillers
  text = text.replace(/you know/gi,'');
  text = text.replace(/basically/gi,'');
  text = text.replace(/actually/gi,'');
  text = text.replace(/again/gi,'');
  text = text.replace(/my question/gi,'');

  return text.trim();
}

// COMPLETE QUESTION
function isComplete(text){

  const words = text.trim().split(" ");

  if(words.length < 5) return false;

  const badEnd = [
    "is",
    "are",
    "the",
    "a",
    "an",
    "of",
    "and",
    "if",
    "or"
  ];

  const last = words[words.length - 1];

  if(badEnd.includes(last)) return false;

  return true;
}

// QUESTION SELECTOR
function getSmartQuestion(text){

  text = text.toLowerCase().trim();

  // keep condition questions
  if(text.includes("if") || text.includes("when")){

    return text;
  }

  // split multiple questions
  let parts = text.split(/\b(and|or|also)\b/);

  let valid = [];

  parts.forEach(p=>{

    let q = p.trim();

    if(q.split(" ").length >= 4){

      valid.push(q);
    }
  });

  if(valid.length === 0) return "";

  // pick first/main question
  return valid[0];
}

// SIMILARITY CHECK
function similar(a,b){

  if(!a || !b) return false;

  if(a === b) return true;

  let A = new Set(a.split(" "));
  let B = new Set(b.split(" "));

  let inter = 0;

  A.forEach(w=>{

    if(B.has(w)) inter++;
  });

  return (inter / Math.max(A.size,B.size)) > 0.8;
}

// AI CALL
async function autoAsk(q){

  const key = localStorage.getItem("gsk");

  if(!key){

    alert("Add API key");
    return;
  }

  const out = document.getElementById("out");

  out.innerHTML = "⏳ Thinking...";

  try{

    const res = await fetch(API,{

      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + key
      },

      body:JSON.stringify({

        model:"llama-3.3-70b-versatile",

        messages:[

          {
            role:"system",

            content:`
You are an engineering interview assistant.

Rules:
- Understand spoken interview questions
- Correct grammar automatically
- Fix incomplete speech
- Answer ONE main question
- If condition exists, explain cause-effect
- Keep answer short and professional
`
          },

          {
            role:"user",
            content:q
          }
        ],

        temperature:0.2
      })
    });

    const data = await res.json();

    if(data.error){

      out.innerHTML = "API ERROR: " + data.error.message;
      return;
    }

    const ans =
      data?.choices?.[0]?.message?.content
      || "No response";

    render(q, ans);

  }catch(err){

    out.innerHTML = "Error: " + err.message;
  }
}

// RENDER
function render(q, ans){

  const out = document.getElementById("out");

  const card = document.createElement("div");

  card.className = "card";

  card.innerHTML = `
    <div class="q">Q: ${q}</div>
    <div class="a">${ans}</div>
  `;

  out.prepend(card);
}

</script>

</body>
</html>
